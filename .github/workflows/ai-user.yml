name: Nightly AI user

on:
  schedule:
    - cron: "30 19 * * *" # 1:00 AM in Sri Lanka
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        persona: [new-user-on-phone, impatient-clicker, careful-organizer]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start the app
        run: |
          npm start > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && break; sleep 1; done

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Let Claude use the app
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash qa/run-persona.sh qa/personas/${{ matrix.persona }}.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.persona }}
          path: reports/

  report:
    needs: explore
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports
          merge-multiple: true

      - name: File issues and write the summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash qa/file-issues.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
